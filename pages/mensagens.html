<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mensagens | Meu Projeto Pessoal</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="../css/app.css">
</head>
<body>

  <header class="site-header">
    <div class="brand">Meu Projeto</div>
    <nav>
      <a href="../index.html">Home</a>
      <a href="sobre.html">Sobre</a>
      <a href="contato.html">Contato</a>
    </nav>
  </header>

  <main>
    <section class="page-intro largo">
      <span class="eyebrow">Área restrita &middot; Administrador</span>
      <h1>Mensagens recebidas</h1>
      <p class="lead">Mensagens enviadas pelo formulário de contato.</p>
    </section>

    <section class="painel">
      <p id="aviso" class="mensagem" role="alert" hidden></p>

      <div class="tabela-container">
        <table>
          <thead>
            <tr>
              <th>Data</th>
              <th>Nome</th>
              <th>E-mail</th>
              <th>Mensagem</th>
              <th>Status</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tabela-mensagens"></tbody>
        </table>
        <p id="vazio" class="vazio" hidden>Nenhuma mensagem recebida ainda.</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>Feito por mim &middot; Colégio UNASP-HT &middot; Técnico em Informática</p>
  </footer>

  <script src="../js/api.js"></script>
  <script src="../js/menu.js"></script>
  <script src="../js/mensagens.js"></script>
</body>
