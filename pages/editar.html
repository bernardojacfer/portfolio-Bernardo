<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar usuário | Meu Projeto Pessoal</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="../css/app.css">
</head>
<body>

  <header class="site-header">
    <div class="brand">Meu Projeto</div>
    <nav>
      <a href="../index.html">Home</a>
      <a href="sobre.html">Sobre</a>
      <a href="contato.html">Contato</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <span class="eyebrow">Área restrita</span>
      <h1 id="titulo">Editar usuário</h1>

      <p id="aviso" class="mensagem" role="alert" hidden></p>

      <form id="form-editar" class="form-auth" novalidate hidden>
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" maxlength="100" required>

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" maxlength="150" required>

        <div id="campo-perfil" hidden>
          <label for="perfil">Perfil</label>
          <select id="perfil" name="perfil">
            <option value="comum">Comum</option>
            <option value="admin">Administrador</option>
          </select>
        </div>

        <label for="senha">Nova senha (opcional)</label>
        <input type="password" id="senha" name="senha" minlength="6" autocomplete="new-password">
        <span class="dica">Deixe em branco para manter a senha atual.</span>

        <button type="submit" class="btn">Salvar alterações</button>
      </form>

      <p><a id="link-voltar" href="dashboard.html">&larr; Voltar</a></p>
    </section>
  </main>

  <footer class="site-footer">
    <p>Feito por mim &middot; Colégio UNASP-HT &middot; Técnico em Informática</p>
  </footer>

  <script src="../js/api.js"></script>
  <script src="../js/menu.js"></script>
  <script src="../js/editar.js"></script>
</body>
</html>
